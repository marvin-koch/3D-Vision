data:
    value:
        accum_grads: 8
        batch_size: 1
        data_dir: ../data/
        edge_sample_size:
            - 32
            - 32
        json_dir: ../json_output/
        method: sample
        num_workers: 1
        precompute_dir: ../pre
        roi_output_size:
            - 64
            - 64
        train_split: 0.8
        use_precomputed: true
        val_split: 0.1
model:
    value:
        act: relu
        dropout: 0.2
        edge_downsample_dim: 128
        geom_channels: 5
        hidden_channels: 128
        in_channels: null
        in_channels_DeepLSD: 1280
        jk_layer: lstm
        mlp_dropout: 0.2
        num_layers: 6
        out_channels: 256
        skip_init: "False"
        v2: true
training:
    value:
        accelerator: auto
        devices: auto
        early_stopping_patience: 20
        edge_loss_w: 1
        epochs: 100
        experiment_name: Attention_Edge_Sampler
        learning_rate: 0.0005
        log_dir: lightning_logs
        monitor_metric: val_combined_auc_epoch
        monitor_mode: max
        node_loss_w: 1
        seed: 42
        threshold_structural: 0.5
