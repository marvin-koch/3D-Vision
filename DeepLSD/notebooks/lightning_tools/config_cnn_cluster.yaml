data:
  data_dir: 'C:\\Users\\shan2\\Documents\\ETH\\MA4\\3DV\\GitHub\\3D-Vision\\DeepLSD\\notebooks\\data'
  json_dir: 'C:\\Users\\shan2\\Documents\\ETH\\MA4\\3DV\\GitHub\\3D-Vision\\DeepLSD\\notebooks\\data\\json_output'      # Path to the directory containing graph JSON files
  h5_path: "/mnt/c/Users/shan2/Documents/ETH/MA4/3DV/GitHub/3D-Vision/DeepLSD/notebooks/lines_data.h5"

  precompute_dir: '/work/scratch/maurdu/data/graph_data/'
  roi_output_size: [64,32]       # Output size (height, width) for ROI Align features
  edge_sample_size: [32,24]       # Output size (height, width) for edge sampling
  batch_size:  1             # Number of graphs per batch
  train_split: 0.8                # Proportion of data for training (0.0 to 1.0)
  val_split: 0.1                  # Proportion of data for validation (0.0 to 1.0)
  # test_split is implicitly 1.0 - train_split - val_split
  num_workers: 0               # Number of subprocesses for data loading (set to 0 if issues arise or no GPU)
  method: 'sample'
  use_precomputed: false # use pre_computed
  k_nn: 10 # ToDo: Implement value to use for the k_nn graph
model:
  # Input dimensions
  in_channels_DeepLSD: 1280       # Dimension of the initial DeepLSD embedding feature per node
  # CNN output channels_conv_roi_embedding = (roi_output_size[0]//2 * roi_output_size[1]//2) -> calculated internally
  in_channels: 128               # Dimension expected by the roi_GAT
  geom_channels: 8          # ← new do not change without changing code in gluestick_{...}.py

  edge_downsample_dim: 20 # project embedded edges to this dimension/num_channels
  hidden_channels: 128          # Number of hidden units in GAT layers
  hidden_channels_cnn: 64           # Number of hidden units in GAT layers

  out_channels: 64                #  Output dimension of the GAT layers (input to the final MLP))
  num_layers: 3            # Number of GAT layers
  dropout: 0.1                    # Dropout rate within GAT layers
  act: 'relu'                     # Activation function for GAT ('relu', 'elu', etc.)
  v2: true                        # Use GATv2 formulation (set to false for GATv1)
  jk_layer: 'cat'                # Jumping Knowledge connection type ('lstm', 'cat', 'max', 'mean', null for None)
  skip_init: "False"
  only_linear: true               # use only linear layers no conv
  # MLP Drop-outs
  mlp_dropout: 0.5

  





  delta_var: 0.6      # cluster radius tolerance
  delta_dist: 0.8     # cluster centroid separation margin
  alpha: 1.0
  beta: 5.0
  gamma: 0.001
  embed_dim: 64
  # Final MLP parameters are derived (input = out_channels, hidden = out_channels, output = 1)
  # load_model_path: "/mnt/c/Users/shan2/Documents/ETH/MA4/3DV/GitHub/3DV-CNN/3D-Vision/DeepLSD/notebooks/lightning_tools/lightning_logs/60r3xpq3/checkpoints/cnn-epoch=02-val_loss=0.00.ckpt"
  #load_model_path: "/mnt/c/Users/shan2/Documents/ETH/MA4/3DV/GitHub/3DV-CNN/3D-Vision/DeepLSD/notebooks/lightning_tools/lightning_logs/t59qm37y/checkpoints/best-model-epoch=03-val_combined_pr_auc_epoch=0.5337.ckpt"
  #load_model_path: "/mnt/c/Users/shan2/Documents/ETH/MA4/3DV/GitHub/3DV-CNN/3D-Vision/DeepLSD/notebooks/lightning_tools/lightning_logs/lightning_project/ykxqz5rz/checkpoints/cnn-epoch=05-val/ari_mean=0.2214.ckpt"
  #load_model_path: "/mnt/c/Users/shan2/Documents/ETH/MA4/3DV/GitHub/3DV-CNN/3D-Vision/DeepLSD/notebooks/lightning_tools/lightning_logs/lightning_project/jw9qoq4a/checkpoints/cnn-epoch=09-val/ari_mean=0.2723.ckpt"
training:
  
  learning_rate: 0.0005            # Optimizer learning rate
  node_loss_w: 1.0                # Weight for the node classification loss term (if multiple losses were used)
  edge_loss_w: 1.0                # Weight for the edge classification loss term (if multiple losses were used)
  precision: "16-mixed"
  accum_grads: 32                # Gradient accumulation

  threshold_structural: 0.5       # Threshold for converting probabilities to binary predictions for Acc/Recall metrics
  epochs: 80                      # Maximum number of training epochs
  accelerator: 'auto'             # Hardware accelerator ('cpu', 'gpu', 'tpu', 'mps', 'auto')
  devices: 'auto'                 # Devices to use ('auto', 1 for 1 GPU, [0, 1] for GPUs 0 and 1, etc.)
  log_dir: "lightning_logs"       # Base directory for saving logs and checkpoints
  early_stopping_patience: 20      # Number of epochs with no improvement in monitored metric before stopping
  monitor_metric: 'val/ari_mean'       # Metric to monitor for checkpointing and early stopping ('val_loss_epoch', 'val_auc', etc.)
  monitor_mode: 'max'             # 'max' if higher metric is better (e.g., AUC, Acc), 'min' if lower is better (e.g., Loss)
  seed: 42                        # Random seed for reproducibility
  experiment_name: "Attention_CNN"

